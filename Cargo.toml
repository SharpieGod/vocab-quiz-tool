[package]
name = "vocab-quiz-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive", "rc"] }
unicode-width = "0.2.2"
strsim = "0.11"
colorize = "0.1.0"
msedge-tts = { version = "0.4.1", features = ["blocking"] }
rodio = "0.22.2"
rayon = "1.12.0"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
